# Open Ticket AI Runtime — deployment configuration
#
# Pipeline logic now lives in Python (open_ticket_ai/pipeline.py).
# This file is kept for reference; all runtime config is via environment
# variables (OTAI_* prefix) or a .env file.
#
# Environment variables:
#   OTAI_LOG_LEVEL              (default: INFO)
#   OTAI_OTOBO_BASE_URL         (default: http://localhost/otobo/nph-genericinterface.pl)
#   OTAI_OTOBO_USERNAME          (default: open_ticket_ai)
#   OTAI_OTOBO_PASSWORD          (required)
#   OTAI_OTOBO_WEBSERVICE_NAME   (default: OpenTicketAI)
#   OTAI_HF_API_TOKEN            (optional)
#   OTAI_ORCHESTRATOR_SLEEP      (default: 0.01)
#   OTAI_TRIGGER_INTERVAL        (default: 0.1)
#   OTAI_CLASSIFICATION_CONFIDENCE_THRESHOLD (default: 0.8)
#   OTAI_INCOMING_QUEUE          (default: OpenTicketAI::Incoming)
#   OTAI_FALLBACK_QUEUE          (default: OpenTicketAI::Unclassified)
#   OTAI_FALLBACK_PRIORITY       (default: medium)
#   OTAI_QUEUE_MODEL             (default: softoft/otai-queue-de-bert-v1)
#   OTAI_PRIORITY_MODEL          (default: softoft/otai-priority-de-bert-v1)
